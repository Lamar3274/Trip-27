const GS=tok=>`/* Trip HQ ↔ Google Sheet sync. Paste into Extensions › Apps Script, then Deploy › New deployment › Web app
   (Execute as: Me · Who has access: Anyone). Copy the web app link into Trip HQ › More › Data › Spreadsheet. */
const TOKEN = '${tok}';            // must match the code shown in Trip HQ
const TAB = 'Trip spending';      // the tab this script uses (created if missing)
const HEAD = ['ID','Date','Amount','Currency','GBP','Category','Note','Split','Updated','Deleted','Source'];

function doGet() { return out({ ok: true, info: 'Trip HQ sync is running. Use Sync in the app.' }); }

function doPost(e) {
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const b = JSON.parse(e.postData.contents || '{}');
    if (b.token !== TOKEN) return out({ ok: false, error: 'Wrong sync code. Copy the script from the app again.' });
    const sh = sheet_(), rows = read_(sh), byId = {};
    rows.forEach(r => byId[r.id] = r);
    (b.rows || []).forEach(a => {
      const r = byId[a.id], vals = [a.id, a.date, a.amt, a.cur, a.gbp, a.cat, a.note, a.split, new Date(+a.upd).toISOString(), '', r ? r.src : 'app'];
      if (!r) { sh.appendRow(vals); }
      else if (+a.upd > r.upd) { sh.getRange(r.row, 1, 1, HEAD.length).setValues([vals]); }
    });
    (b.deleted || []).forEach(d => {
      const r = byId[d.id];
      if (r && !r.deleted && +d.upd >= r.upd) sh.getRange(r.row, 9, 1, 2).setValues([[new Date(+d.upd).toISOString(), 'TRUE']]);
    });
    const adj = months_(b);
    return out({ ok: true, adj: adj, rows: read_(sh).map(r => ({ id: r.id, date: r.date, amt: r.amt, cur: r.cur, gbp: r.gbp, cat: r.cat, note: r.note, split: r.split, upd: r.upd, deleted: r.deleted })) });
  } finally { lock.releaseLock(); }
}

/* Month tabs (Dec, Jan, Feb, March…): fills the GBP and BHAT cell for each category with the app's total
   (spending is negative, like you type it). Formula cells are never touched. If you typed a different number
   into one of these cells since the last sync, the difference is sent back to the app as an adjustment. */
function months_(b) {
  const ss = SpreadsheetApp.getActiveSpreadsheet(), props = PropertiesService.getDocumentProperties(), adj = [];
  const names = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const cats = (b.cats || []).map(c => [String(c).toLowerCase(), c]), totals = b.totals || {};
  const r2 = n => Math.round((+n || 0) * 100) / 100;
  ss.getSheets().forEach(sh => {
    const name = sh.getName(), idx = names.indexOf(name.trim().slice(0, 3).toLowerCase());
    if (idx < 0 || name === TAB) return;
    const month = (idx === 11 ? '2026' : '2027') + '-' + ('0' + (idx + 1)).slice(-2);
    const range = sh.getDataRange(), v = range.getValues(), f = range.getFormulas();
    let hr = -1, cols = {};
    for (let r = 0; r < Math.min(v.length, 10) && hr < 0; r++) v[r].forEach((x, c) => { const t = String(x).trim().toLowerCase(); if (t === 'gbp') { hr = r; cols.GBP = c; } if (/^(bhat|baht|thb)$/.test(t)) cols.THB = c; });
    if (hr < 0) return;
    for (let r = hr + 1; r < v.length; r++) {
      const label = String(v[r][0]).trim().toLowerCase(), hit = cats.find(x => x[0] === label);
      if (!hit) continue;
      ['GBP', 'THB'].forEach(cur => {
        const c = cols[cur]; if (c == null || f[r][c]) return;
        const key = ['last', name, hit[1], cur].join('|'), last = props.getProperty(key), raw = v[r][c];
        const cell = r2(raw), app = r2(((totals[month] || {})[hit[1]] || {})[cur]);
        let want = -app;
        const ref = last === null ? (raw === '' || cell === 0 ? cell : want) : r2(last);
        if (cell !== r2(ref)) { const d = r2(ref - cell); adj.push({ id: 'adj-' + month + '-' + hit[1].replace(/[^A-Za-z]+/g, '') + '-' + cur + '-' + Date.now() + r, month: month, tab: name, cat: hit[1], cur: cur, amt: d }); want = -(app + d); }
        want = r2(want);
        if (cell !== want) sh.getRange(r + 1, c + 1).setValue(want === 0 && raw === '' ? '' : want);
        props.setProperty(key, String(want));
      });
    }
  });
  return adj;
}

/* Typing in the sheet stamps the row, so your newest change wins on the next sync. */
function onEdit(e) {
  const sh = e.range.getSheet(); if (sh.getName() !== TAB || e.range.getRow() < 2 || e.range.getColumn() >= 9) return;
  for (let r = e.range.getRow(); r < e.range.getRow() + e.range.getNumRows(); r++) sh.getRange(r, 9).setValue(new Date().toISOString());
}

function sheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(TAB);
  if (!sh) { sh = ss.insertSheet(TAB); sh.appendRow(HEAD); sh.setFrozenRows(1); sh.getRange('B:B').setNumberFormat('yyyy-mm-dd'); }
  return sh;
}

function read_(sh) {
  const v = sh.getDataRange().getValues(), tz = Session.getScriptTimeZone(), out = [];
  for (let i = 1; i < v.length; i++) {
    const x = v[i];
    if (x.slice(1, 8).every(c => c === '' || c === null)) continue;
    let id = String(x[0] || '');
    if (!id) { id = 'sh-' + Utilities.getUuid().slice(0, 8); x[9] = x[9] || ''; sh.getRange(i + 1, 1).setValue(id); sh.getRange(i + 1, 9).setValue(new Date().toISOString()); sh.getRange(i + 1, 11).setValue('sheet'); x[8] = new Date().toISOString(); x[10] = 'sheet'; }
    const d = x[1] instanceof Date ? Utilities.formatDate(x[1], tz, 'yyyy-MM-dd') : String(x[1]).slice(0, 10);
    out.push({ row: i + 1, id: id, date: d, amt: +x[2] || 0, cur: String(x[3] || 'GBP').toUpperCase(), gbp: x[4] === '' ? '' : +x[4], cat: String(x[5] || ''), note: String(x[6] || ''), split: +x[7] || 1, upd: Date.parse(x[8]) || 0, deleted: String(x[9]).toUpperCase() === 'TRUE', src: String(x[10] || '') });
  }
  return out;
}

function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
